# Corre en cada PR a main. No se conecta a Fabric ni a la base: no necesita credenciales.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r deploy/requirements.txt
      - name: parameter.yml, GUID sin parametrizar, secretos y migraciones
        run: python deploy/validar.py --ambientes TEST,PRD
